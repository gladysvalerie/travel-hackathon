<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TripLedger</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <!-- Header -->
    <header class="header">
      <div class="logo-placeholder">📋</div>
      <h1 class="title">TripLedger</h1>
    </header>

    <!-- Auth Section -->
    <section id="auth-view" class="auth-section">
      <!-- Login View -->
      <div id="login-view" class="auth-view">
        <h2>Log In</h2>
        <div class="form-group">
          <label for="login-email">Email</label>
          <input
            type="email"
            id="login-email"
            class="input"
            placeholder="your@email.com"
            required
          />
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input
            type="password"
            id="login-password"
            class="input"
            placeholder="••••••••"
            required
          />
        </div>
        <button id="login-btn" class="btn btn-primary">
          <span class="btn-icon">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <line x1="5" y1="12" x2="19" y2="12" />
              <polyline points="12 5 19 12 12 19" />
            </svg>
          </span>
          Log in
        </button>
        <button id="show-signup-btn" class="btn-link">Sign up instead</button>
      </div>

      <!-- Signup View -->
      <div id="signup-view" class="auth-view hidden">
        <h2>Sign Up</h2>
        <div class="form-group">
          <label for="signup-email">Email</label>
          <input
            type="email"
            id="signup-email"
            class="input"
            placeholder="your@email.com"
            required
          />
        </div>
        <div class="form-group">
          <label for="signup-password">Password</label>
          <input
            type="password"
            id="signup-password"
            class="input"
            placeholder="••••••••"
            required
          />
        </div>
        <div class="form-group">
          <label for="signup-confirm">Confirm Password</label>
          <input
            type="password"
            id="signup-confirm"
            class="input"
            placeholder="••••••••"
            required
          />
        </div>
        <button id="signup-btn" class="btn btn-primary">
          <span class="btn-icon">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <line x1="12" y1="5" x2="12" y2="19" />
              <line x1="5" y1="12" x2="19" y2="12" />
            </svg>
          </span>
          Sign up
        </button>
        <button id="show-login-btn" class="btn-link">Back to login</button>
      </div>
    </section>

    <!-- Dashboard View (visible when logged in) -->
    <section id="dashboard-view" class="dashboard-section hidden">
      <!-- Profile Section -->
      <div class="profile-section" id="profile-section">
        <div class="profile-picture" id="profile-picture">MT</div>
        <div class="profile-info">
          <div class="profile-name" id="profile-name">Melvin Tang</div>
          <div class="profile-email" id="profile-email-display">
            test@example.com
          </div>
        </div>
        <div class="profile-arrow">›</div>
      </div>

      <div class="greeting">Hi, <span id="user-email"></span> 👋</div>

      <div class="actions">
        <button type="button" id="btn-screenshot" class="btn btn-action">
          <span class="btn-icon">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"
              />
              <circle cx="12" cy="13" r="4" />
            </svg>
          </span>
          Screenshot booking
        </button>

        <!-- Screenshot options dialog -->
        <div id="screenshot-options" class="hidden">
          <p>Select screenshot mode:</p>
          <div class="screenshot-options-buttons">
            <button
              type="button"
              id="btn-screenshot-full"
              class="btn btn-secondary"
            >
              <span class="btn-icon">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <rect x="2" y="6" width="20" height="12" rx="2" />
                  <path d="M12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4z" />
                </svg>
              </span>
              Full page
            </button>
            <button
              type="button"
              id="btn-screenshot-region"
              class="btn btn-secondary"
            >
              <span class="btn-icon">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <rect x="3" y="3" width="18" height="18" rx="2" />
                  <path d="M9 9h6v6H9z" />
                </svg>
              </span>
              Select area
            </button>
            <button
              type="button"
              id="btn-screenshot-cancel"
              class="btn btn-secondary"
            >
              <span class="btn-icon">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <line x1="18" y1="6" x2="6" y2="18" />
                  <line x1="6" y1="6" x2="18" y2="18" />
                </svg>
              </span>
              Cancel
            </button>
          </div>
        </div>

        <button type="button" id="btn-upload" class="btn btn-action">
          <span class="btn-icon">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="17 8 12 3 7 8" />
              <line x1="12" y1="3" x2="12" y2="15" />
            </svg>
          </span>
          Upload file
        </button>
        <input
          type="file"
          id="file-input"
          accept=".pdf,.png,.jpg,.jpeg,.gif,.webp"
          class="hidden"
        />
        <button type="button" id="btn-manual" class="btn btn-action">
          <span class="btn-icon">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"
              />
              <path
                d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"
              />
            </svg>
          </span>
          Enter manually
        </button>
      </div>

      <div id="recent-bookings" class="recent-bookings">
        <h3>Recent bookings</h3>
        <ul id="recent-bookings-list" class="bookings-list">
          <!-- Filled dynamically -->
        </ul>
      </div>
    </section>

    <!-- Region Selection Message View -->
    <section id="region-selection-view" class="region-selection-section hidden">
      <div class="region-selection-content">
        <h2>Select Area</h2>
        <p class="region-selection-message">
          Click and drag to select the area you want to screenshot
        </p>
        <div class="progress-bar-container">
          <div class="progress-bar" id="region-progress-bar"></div>
        </div>
      </div>
    </section>

    <!-- Screenshot Preview View -->
    <section
      id="screenshot-preview-view"
      class="screenshot-preview-section hidden"
    >
      <h2>Screenshot Preview</h2>
      <div class="preview-container">
        <img id="screenshot-preview-image" src="" alt="Screenshot preview" />
      </div>
      <div class="preview-actions">
        <button type="button" id="btn-use-screenshot" class="btn btn-primary">
          <span class="btn-icon">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <polyline points="20 6 9 17 4 12" />
            </svg>
          </span>
          Use this screenshot
        </button>
        <button
          type="button"
          id="btn-retake-screenshot"
          class="btn btn-secondary"
        >
          <span class="btn-icon">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <polyline points="23 4 23 10 17 10" />
              <polyline points="1 20 1 14 7 14" />
              <path
                d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"
              />
            </svg>
          </span>
          Retake
        </button>
      </div>
    </section>

    <!-- Manual Booking Form View -->
    <section id="manual-form-view" class="manual-form-section hidden">
      <h2>Add flight booking</h2>
      <p id="screenshot-status" class="screenshot-status"></p>

      <div id="manual-form-error" class="form-error hidden"></div>

      <!-- AI Extraction Actions -->
      <div class="ai-actions">
        <button type="button" id="btn-ai-fill" class="btn btn-secondary">
          <span class="btn-icon">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
              <circle cx="9" cy="9" r="1" />
              <circle cx="15" cy="9" r="1" />
              <path d="M9 15h6" />
            </svg>
          </span>
          Extract from screenshot
        </button>
        <span id="ai-status" class="ai-status"></span>
      </div>

      <form id="manual-booking-form" class="booking-form">
        <div class="form-group">
          <label for="field-airline">Airline / Provider *</label>
          <input
            type="text"
            id="field-airline"
            class="input"
            placeholder="e.g., EVA Air"
            required
          />
        </div>

        <div class="form-group">
          <label for="field-flight-number">Flight number *</label>
          <input
            type="text"
            id="field-flight-number"
            class="input"
            placeholder="e.g., BR196"
            required
          />
        </div>

        <!-- Origin/Destination Row with Arrow -->
        <div class="origin-destination-row">
          <div class="form-group">
            <label for="field-origin">Origin *</label>
            <input
              type="text"
              id="field-origin"
              class="input"
              placeholder="TPE"
              required
            />
          </div>
          <div class="origin-destination-arrow">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="currentColor"
            >
              <path d="M5 12h14M12 5l7 7-7 7" />
            </svg>
          </div>
          <div class="form-group">
            <label for="field-destination">Destination *</label>
            <input
              type="text"
              id="field-destination"
              class="input"
              placeholder="NRT"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label for="field-departure">Departure date/time *</label>
          <input
            type="datetime-local"
            id="field-departure"
            class="input"
            required
          />
        </div>

        <div class="form-group">
          <label for="field-arrival">Arrival date/time *</label>
          <input
            type="datetime-local"
            id="field-arrival"
            class="input"
            required
          />
        </div>

        <div class="form-row">
          <div class="form-group" style="flex: 1">
            <label for="field-price">Total price *</label>
            <input
              type="number"
              id="field-price"
              class="input"
              placeholder="8200"
              step="0.01"
              required
            />
          </div>
          <div class="form-group" style="flex: 0 0 auto">
            <label for="field-currency">Currency</label>
            <select id="field-currency" class="input">
              <option value="TWD">TWD</option>
              <option value="USD">USD</option>
              <option value="EUR">EUR</option>
              <option value="GBP">GBP</option>
              <option value="JPY">JPY</option>
              <option value="CNY">CNY</option>
              <option value="AUD">AUD</option>
              <option value="CAD">CAD</option>
              <option value="CHF">CHF</option>
              <option value="SGD">SGD</option>
              <option value="HKD">HKD</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="field-reference">Booking reference / PNR</label>
          <input
            type="text"
            id="field-reference"
            class="input"
            placeholder="e.g., ABC123"
          />
        </div>

        <div class="form-group">
          <label for="field-notes">Notes</label>
          <textarea
            id="field-notes"
            class="input textarea"
            rows="3"
            placeholder="Optional notes..."
          ></textarea>
        </div>
      </form>

      <!-- Fixed Form Actions at Bottom -->
      <div class="form-actions-fixed">
        <button type="button" id="btn-save-booking" class="btn btn-primary">
          <span class="btn-icon">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <polyline points="20 6 9 17 4 12" />
            </svg>
          </span>
          Save booking
        </button>
        <button type="button" id="btn-cancel-booking" class="btn btn-secondary">
          <span class="btn-icon">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          </span>
          Cancel
        </button>
      </div>
    </section>

    <!-- Profile Modal -->
    <div id="profile-modal" class="profile-modal">
      <div class="profile-modal-content">
        <div class="profile-modal-header">
          <h2>Profile</h2>
          <button class="profile-modal-close" id="profile-modal-close">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              width="20"
              height="20"
            >
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          </button>
        </div>
        <div class="profile-modal-body">
          <div class="profile-modal-picture" id="profile-modal-picture">MT</div>
          <div class="profile-modal-name" id="profile-modal-name">
            Melvin Tang
          </div>
          <div class="profile-modal-email" id="profile-modal-email">
            test@example.com
          </div>
          <button
            class="btn btn-primary"
            id="profile-logout-btn"
            style="margin-top: 20px; width: 100%"
          >
            <span class="btn-icon">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                <polyline points="16 17 21 12 16 7" />
                <line x1="21" y1="12" x2="9" y2="12" />
              </svg>
            </span>
            Log out
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
