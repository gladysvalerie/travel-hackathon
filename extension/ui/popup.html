<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TripLedger</title>
    <link rel="stylesheet" href="style/popup.css" />
  </head>
  <body>
    <!-- Header -->
    <header class="header">
      <div class="logo-placeholder">📋</div>
      <h1 class="title">TripLedger</h1>
    </header>

    <!-- Auth Section -->
    <section id="auth-view" class="auth-section">
      <!-- Login View -->
      <div id="login-view" class="auth-view">
        <h2>Log In</h2>
        <div class="form-group">
          <label for="login-email">Email</label>
          <input
            type="email"
            id="login-email"
            class="input"
            placeholder="your@email.com"
            required
          />
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input
            type="password"
            id="login-password"
            class="input"
            placeholder="••••••••"
            required
          />
        </div>
        <button id="login-btn" class="btn btn-primary">
          <span class="btn-icon">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <line x1="5" y1="12" x2="19" y2="12" />
              <polyline points="12 5 19 12 12 19" />
            </svg>
          </span>
          Log in
        </button>
        <button id="show-signup-btn" class="btn-link">Sign up instead</button>
      </div>

      <!-- Signup View -->
      <div id="signup-view" class="auth-view hidden">
        <h2>Sign Up</h2>
        <div class="form-group">
          <label for="signup-email">Email</label>
          <input
            type="email"
            id="signup-email"
            class="input"
            placeholder="your@email.com"
            required
          />
        </div>
        <div class="form-group">
          <label for="signup-password">Password</label>
          <input
            type="password"
            id="signup-password"
            class="input"
            placeholder="••••••••"
            required
          />
        </div>
        <div class="form-group">
          <label for="signup-confirm">Confirm Password</label>
          <input
            type="password"
            id="signup-confirm"
            class="input"
            placeholder="••••••••"
            required
          />
        </div>
        <button id="signup-btn" class="btn btn-primary">
          <span class="btn-icon">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <line x1="12" y1="5" x2="12" y2="19" />
              <line x1="5" y1="12" x2="19" y2="12" />
            </svg>
          </span>
          Sign up
        </button>
        <button id="show-login-btn" class="btn-link">Back to login</button>
      </div>
    </section>

    <!-- Main App View (visible when logged in) -->
    <section id="dashboard-view" class="dashboard-section hidden">
      <!-- Profile Section -->
      <div class="profile-section" id="profile-section">
        <div class="profile-picture" id="profile-picture">MT</div>
        <div class="profile-info">
          <div class="profile-name" id="profile-name">Melvin Tang</div>
          <div class="profile-email" id="profile-email-display">
            test@example.com
          </div>
        </div>
        <div class="profile-arrow">›</div>
      </div>

      <!-- Tab Navigation -->
      <div class="tab-navigation">
        <button type="button" id="tab-add" class="tab-btn active">Add</button>
        <button type="button" id="tab-history" class="tab-btn">History</button>
      </div>

      <!-- Add Tab Content -->
      <div id="tab-add-content" class="tab-content">
        <!-- Home View: Category Grid -->
        <div id="home-view" class="home-view">
          <div class="category-grid">
            <button
              type="button"
              id="btn-category-flight"
              class="category-card"
            >
              <div class="category-icon">✈️</div>
              <div class="category-label">Flight</div>
            </button>
            <button type="button" id="btn-category-hotel" class="category-card">
              <div class="category-icon">🏨</div>
              <div class="category-label">Hotel</div>
            </button>
            <button
              type="button"
              id="btn-category-restaurant"
              class="category-card"
            >
              <div class="category-icon">🍽️</div>
              <div class="category-label">Restaurant</div>
            </button>
            <button
              type="button"
              id="btn-category-attraction"
              class="category-card"
            >
              <div class="category-icon">🎢</div>
              <div class="category-label">Attraction</div>
            </button>
          </div>
        </div>

        <!-- Category Actions View -->
        <div id="category-actions-view" class="category-actions-view hidden">
          <div class="category-actions-header">
            <button
              type="button"
              id="btn-category-back"
              class="btn btn-icon-only"
            >
              <span class="btn-icon">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <polyline points="15 18 9 12 15 6" />
                </svg>
              </span>
            </button>
            <h2 id="category-actions-title">Add booking</h2>
          </div>
          <div class="category-actions-buttons">
            <button
              type="button"
              id="btn-category-screenshot"
              class="btn btn-action"
            >
              <span class="btn-icon">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path
                    d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"
                  />
                  <circle cx="12" cy="13" r="4" />
                </svg>
              </span>
              <span class="btn-text">Screenshot booking</span>
            </button>

            <!-- Screenshot options dialog -->
            <div id="screenshot-options" class="hidden">
              <p>Select screenshot mode:</p>
              <div class="screenshot-options-buttons">
                <button
                  type="button"
                  id="btn-screenshot-full"
                  class="btn btn-secondary"
                >
                  <span class="btn-icon">
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                    >
                      <rect x="2" y="6" width="20" height="12" rx="2" />
                      <path d="M12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4z" />
                    </svg>
                  </span>
                  Full page
                </button>
                <button
                  type="button"
                  id="btn-screenshot-region"
                  class="btn btn-secondary"
                >
                  <span class="btn-icon">
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                    >
                      <rect x="3" y="3" width="18" height="18" rx="2" />
                      <path d="M9 9h6v6H9z" />
                    </svg>
                  </span>
                  Select area
                </button>
                <button
                  type="button"
                  id="btn-screenshot-cancel"
                  class="btn btn-secondary"
                >
                  <span class="btn-icon">
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                    >
                      <line x1="18" y1="6" x2="6" y2="18" />
                      <line x1="6" y1="6" x2="18" y2="18" />
                    </svg>
                  </span>
                  Cancel
                </button>
              </div>
            </div>

            <button
              type="button"
              id="btn-category-upload"
              class="btn btn-action"
            >
              <span class="btn-icon">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                  <polyline points="17 8 12 3 7 8" />
                  <line x1="12" y1="3" x2="12" y2="15" />
                </svg>
              </span>
              <span class="btn-text">Upload file (PDF / image)</span>
            </button>
            <input
              type="file"
              id="file-input"
              accept=".pdf,.png,.jpg,.jpeg,.gif,.webp"
              class="hidden"
            />

            <button
              type="button"
              id="btn-category-manual"
              class="btn btn-action"
            >
              <span class="btn-icon">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path
                    d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"
                  />
                  <path
                    d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"
                  />
                </svg>
              </span>
              <span class="btn-text">Enter manually</span>
            </button>
          </div>
        </div>
      </div>

      <!-- History Tab Content -->
      <div id="tab-history-content" class="tab-content hidden">
        <div id="history-view" class="history-view">
          <div class="history-filters">
            <button
              type="button"
              id="history-filter-all"
              class="filter-btn active"
            >
              All
            </button>
            <button type="button" id="history-filter-flight" class="filter-btn">
              Flight
            </button>
            <button type="button" id="history-filter-hotel" class="filter-btn">
              Hotel
            </button>
            <button
              type="button"
              id="history-filter-restaurant"
              class="filter-btn"
            >
              Restaurant
            </button>
            <button
              type="button"
              id="history-filter-attraction"
              class="filter-btn"
            >
              Attraction
            </button>
          </div>
          <div id="history-list" class="history-list">
            <!-- Filled dynamically -->
          </div>
        </div>
      </div>
    </section>

    <!-- Region Selection Message View -->
    <section id="region-selection-view" class="region-selection-section hidden">
      <div class="region-selection-content">
        <h2>Select Area</h2>
        <p class="region-selection-message">
          Click and drag to select the area you want to screenshot
        </p>
        <div class="progress-bar-container">
          <div class="progress-bar" id="region-progress-bar"></div>
        </div>
      </div>
    </section>

    <!-- Screenshot Preview View -->
    <section
      id="screenshot-preview-view"
      class="screenshot-preview-section hidden"
    >
      <h2>Screenshot Preview</h2>
      <div class="preview-container">
        <img id="screenshot-preview-image" src="" alt="Screenshot preview" />
      </div>
      <div class="preview-actions">
        <button type="button" id="btn-use-screenshot" class="btn btn-primary">
          <span class="btn-icon">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <polyline points="20 6 9 17 4 12" />
            </svg>
          </span>
          Use this screenshot
        </button>
        <button
          type="button"
          id="btn-retake-screenshot"
          class="btn btn-secondary"
        >
          <span class="btn-icon">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <polyline points="23 4 23 10 17 10" />
              <polyline points="1 20 1 14 7 14" />
              <path
                d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"
              />
            </svg>
          </span>
          Retake
        </button>
      </div>
    </section>

    <!-- Manual Booking Form View -->
    <section id="manual-form-view" class="manual-form-section hidden">
      <h2 id="manual-form-title">Add booking</h2>
      <p id="screenshot-status" class="screenshot-status"></p>

      <!-- Screenshot/PDF Preview -->
      <div id="file-preview-container" class="file-preview-container hidden">
        <div class="file-preview">
          <img
            id="file-preview-image"
            class="file-preview-image hidden"
            alt="Preview"
          />
          <div id="file-preview-pdf" class="file-preview-pdf hidden">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              width="48"
              height="48"
            >
              <path
                d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
              ></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
              <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
            <span id="file-preview-name" class="file-preview-name"></span>
          </div>
          <button
            type="button"
            id="btn-remove-file"
            class="btn-remove-file"
            title="Remove file"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              width="20"
              height="20"
            >
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
      </div>

      <div id="manual-form-error" class="form-error hidden"></div>

      <!-- AI Extraction Actions (only for flight) -->
      <div class="ai-actions" id="ai-actions-container">
        <button type="button" id="btn-ai-fill" class="btn btn-secondary">
          <span class="btn-icon">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"
              />
              <circle cx="12" cy="12" r="4" />
            </svg>
          </span>
          <span class="btn-text">Extract from screenshot</span>
        </button>
        <span id="ai-status" class="ai-status"></span>
      </div>

      <!-- Flight Form -->
      <form id="manual-form-flight" class="booking-form hidden">
        <div class="form-group">
          <label for="field-airline">Airline / Provider *</label>
          <input
            type="text"
            id="field-airline"
            class="input"
            placeholder="e.g., EVA Air"
            required
          />
        </div>
        <div class="form-group">
          <label for="field-flight-number">Flight number *</label>
          <input
            type="text"
            id="field-flight-number"
            class="input"
            placeholder="e.g., BR196"
            required
          />
        </div>
        <div class="origin-destination-row">
          <div class="form-group">
            <label for="field-origin">Origin *</label>
            <input
              type="text"
              id="field-origin"
              class="input"
              placeholder="TPE"
              required
            />
          </div>
          <div class="origin-destination-arrow">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="currentColor"
            >
              <path d="M5 12h14M12 5l7 7-7 7" />
            </svg>
          </div>
          <div class="form-group">
            <label for="field-destination">Destination *</label>
            <input
              type="text"
              id="field-destination"
              class="input"
              placeholder="NRT"
              required
            />
          </div>
        </div>
        <div class="form-group">
          <label for="field-departure">Departure date/time *</label>
          <input
            type="datetime-local"
            id="field-departure"
            class="input"
            required
          />
        </div>
        <div class="form-group">
          <label for="field-arrival">Arrival date/time *</label>
          <input
            type="datetime-local"
            id="field-arrival"
            class="input"
            required
          />
        </div>
        <div class="form-row">
          <div class="form-group" style="flex: 1">
            <label for="field-price">Total price *</label>
            <input
              type="number"
              id="field-price"
              class="input"
              placeholder="8200"
              step="0.01"
              required
            />
          </div>
          <div class="form-group" style="flex: 0 0 auto">
            <label for="field-currency">Currency</label>
            <select id="field-currency" class="input">
              <option value="TWD">TWD</option>
              <option value="USD">USD</option>
              <option value="EUR">EUR</option>
              <option value="GBP">GBP</option>
              <option value="JPY">JPY</option>
              <option value="CNY">CNY</option>
              <option value="AUD">AUD</option>
              <option value="CAD">CAD</option>
              <option value="CHF">CHF</option>
              <option value="SGD">SGD</option>
              <option value="HKD">HKD</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label for="field-reference">Booking reference / PNR</label>
          <input
            type="text"
            id="field-reference"
            class="input"
            placeholder="e.g., ABC123"
          />
        </div>
        <div class="form-group">
          <label for="field-notes">Notes</label>
          <textarea
            id="field-notes"
            class="input textarea"
            rows="3"
            placeholder="Optional notes..."
          ></textarea>
        </div>
      </form>

      <!-- Hotel Form -->
      <form id="manual-form-hotel" class="booking-form hidden">
        <div class="form-group">
          <label for="field-hotel-name">Hotel name *</label>
          <input
            type="text"
            id="field-hotel-name"
            class="input"
            placeholder="e.g., Li Shin Hotel"
            required
          />
        </div>
        <div class="form-group">
          <label for="field-hotel-address">Address *</label>
          <input
            type="text"
            id="field-hotel-address"
            class="input"
            placeholder="Street address"
            required
          />
        </div>
        <div class="form-row">
          <div class="form-group" style="flex: 1">
            <label for="field-city">City *</label>
            <input
              type="text"
              id="field-city"
              class="input"
              placeholder="e.g., Tokyo"
              required
            />
          </div>
          <div class="form-group" style="flex: 1">
            <label for="field-country">Country *</label>
            <input
              type="text"
              id="field-country"
              class="input"
              placeholder="e.g., Japan"
              required
            />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group" style="flex: 1">
            <label for="field-check-in">Check-in date *</label>
            <input type="date" id="field-check-in" class="input" required />
          </div>
          <div class="form-group" style="flex: 1">
            <label for="field-check-out">Check-out date *</label>
            <input type="date" id="field-check-out" class="input" required />
          </div>
        </div>
        <div class="form-group">
          <label for="field-nights">Nights *</label>
          <input
            type="number"
            id="field-nights"
            class="input"
            placeholder="2"
            min="1"
            required
          />
        </div>
        <div class="form-group">
          <label for="field-room-type">Room type</label>
          <input
            type="text"
            id="field-room-type"
            class="input"
            placeholder="e.g., Standard Double"
          />
        </div>
        <div class="form-group">
          <label for="field-guests">Guests *</label>
          <input
            type="number"
            id="field-guests"
            class="input"
            placeholder="2"
            min="1"
            required
          />
        </div>
        <div class="form-row">
          <div class="form-group" style="flex: 1">
            <label for="field-price-hotel">Total price *</label>
            <input
              type="number"
              id="field-price-hotel"
              class="input"
              placeholder="15000"
              step="0.01"
              required
            />
          </div>
          <div class="form-group" style="flex: 0 0 auto">
            <label for="field-currency-hotel">Currency</label>
            <select id="field-currency-hotel" class="input">
              <option value="TWD">TWD</option>
              <option value="USD">USD</option>
              <option value="EUR">EUR</option>
              <option value="GBP">GBP</option>
              <option value="JPY">JPY</option>
              <option value="CNY">CNY</option>
              <option value="AUD">AUD</option>
              <option value="CAD">CAD</option>
              <option value="CHF">CHF</option>
              <option value="SGD">SGD</option>
              <option value="HKD">HKD</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label for="field-platform-hotel">Platform</label>
          <input
            type="text"
            id="field-platform-hotel"
            class="input"
            placeholder="e.g., Agoda, Booking.com"
          />
        </div>
        <div class="form-group">
          <label for="field-reservation-id">Reservation ID</label>
          <input
            type="text"
            id="field-reservation-id"
            class="input"
            placeholder="e.g., ABC123"
          />
        </div>
        <div class="form-group">
          <label for="field-notes-hotel">Notes</label>
          <textarea
            id="field-notes-hotel"
            class="input textarea"
            rows="3"
            placeholder="Optional notes..."
          ></textarea>
        </div>
      </form>

      <!-- Restaurant Form -->
      <form id="manual-form-restaurant" class="booking-form hidden">
        <div class="form-group">
          <label for="field-restaurant-name">Restaurant name *</label>
          <input
            type="text"
            id="field-restaurant-name"
            class="input"
            placeholder="e.g., Sushi Saito"
            required
          />
        </div>
        <div class="form-group">
          <label for="field-location-text">Location</label>
          <input
            type="text"
            id="field-location-text"
            class="input"
            placeholder="e.g., Tokyo, Japan"
          />
        </div>
        <div class="form-group">
          <label for="field-google-maps-url">Google Maps URL</label>
          <div class="input-with-icon">
            <input
              type="url"
              id="field-google-maps-url"
              class="input"
              placeholder="https://maps.google.com/..."
            />
            <button
              type="button"
              id="btn-open-gmaps-restaurant"
              class="btn-open-gmaps"
              title="Open in Google Maps"
              style="display: none"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                width="18"
                height="18"
              >
                <path
                  d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"
                ></path>
                <polyline points="15 3 21 3 21 9"></polyline>
                <line x1="10" y1="14" x2="21" y2="3"></line>
              </svg>
            </button>
          </div>
        </div>
        <div class="form-group">
          <label for="field-visit-datetime">Visit date/time *</label>
          <input
            type="datetime-local"
            id="field-visit-datetime"
            class="input"
            required
          />
        </div>
        <div class="form-group">
          <label for="field-party-size">Party size *</label>
          <input
            type="number"
            id="field-party-size"
            class="input"
            placeholder="2"
            min="1"
            required
          />
        </div>
        <div class="form-row">
          <div class="form-group" style="flex: 1">
            <label for="field-price-restaurant">Total price *</label>
            <input
              type="number"
              id="field-price-restaurant"
              class="input"
              placeholder="5000"
              step="0.01"
              required
            />
          </div>
          <div class="form-group" style="flex: 0 0 auto">
            <label for="field-currency-restaurant">Currency</label>
            <select id="field-currency-restaurant" class="input">
              <option value="TWD">TWD</option>
              <option value="USD">USD</option>
              <option value="EUR">EUR</option>
              <option value="GBP">GBP</option>
              <option value="JPY">JPY</option>
              <option value="CNY">CNY</option>
              <option value="AUD">AUD</option>
              <option value="CAD">CAD</option>
              <option value="CHF">CHF</option>
              <option value="SGD">SGD</option>
              <option value="HKD">HKD</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label for="field-restaurant-receipt">Receipt (file upload)</label>
          <input
            type="file"
            id="field-restaurant-receipt"
            class="input"
            accept=".pdf,.png,.jpg,.jpeg"
          />
        </div>
        <div class="form-group">
          <label>Dishes</label>
          <div id="restaurant-dishes-container">
            <div id="restaurant-dishes-list" class="dishes-list"></div>
            <div class="dish-add-controls">
              <div class="dish-input-row">
                <input
                  type="text"
                  id="dish-name-input"
                  class="input"
                  placeholder="Dish name"
                  style="flex: 1"
                />
                <input
                  type="number"
                  id="dish-price-input"
                  class="input"
                  placeholder="Price"
                  step="0.01"
                  min="0"
                  style="flex: 0 0 100px; margin-left: 8px"
                />
                <button
                  type="button"
                  id="btn-add-dish"
                  class="btn btn-secondary"
                  style="margin-left: 8px"
                >
                  Add
                </button>
              </div>
            </div>
          </div>
        </div>
        <div class="form-group">
          <label for="field-notes-restaurant">Notes</label>
          <textarea
            id="field-notes-restaurant"
            class="input textarea"
            rows="3"
            placeholder="Optional notes..."
          ></textarea>
        </div>
      </form>

      <!-- Attraction Form -->
      <form id="manual-form-attraction" class="booking-form hidden">
        <div class="form-group">
          <label for="field-attraction-name">Attraction name *</label>
          <input
            type="text"
            id="field-attraction-name"
            class="input"
            placeholder="e.g., Disneyland Tokyo"
            required
          />
        </div>
        <div class="form-group">
          <label for="field-location-text-attraction">Location *</label>
          <input
            type="text"
            id="field-location-text-attraction"
            class="input"
            placeholder="e.g., Tokyo, Japan"
            required
          />
        </div>
        <div class="form-group">
          <label for="field-google-maps-url-attraction">Google Maps URL</label>
          <div class="input-with-icon">
            <input
              type="url"
              id="field-google-maps-url-attraction"
              class="input"
              placeholder="https://maps.google.com/..."
            />
            <button
              type="button"
              id="btn-open-gmaps-attraction"
              class="btn-open-gmaps"
              title="Open in Google Maps"
              style="display: none"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                width="18"
                height="18"
              >
                <path
                  d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"
                ></path>
                <polyline points="15 3 21 3 21 9"></polyline>
                <line x1="10" y1="14" x2="21" y2="3"></line>
              </svg>
            </button>
          </div>
        </div>
        <div class="form-group">
          <label for="field-visit-datetime-attraction">Visit date/time *</label>
          <input
            type="datetime-local"
            id="field-visit-datetime-attraction"
            class="input"
            required
          />
        </div>
        <div class="form-row">
          <div class="form-group" style="flex: 1">
            <label for="field-ticket-count">Ticket count *</label>
            <input
              type="number"
              id="field-ticket-count"
              class="input"
              placeholder="2"
              min="1"
              required
            />
          </div>
          <div class="form-group" style="flex: 1">
            <label for="field-ticket-price-per-person"
              >Price per person *</label
            >
            <input
              type="number"
              id="field-ticket-price-per-person"
              class="input"
              placeholder="5000"
              step="0.01"
              required
            />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group" style="flex: 1">
            <label for="field-price-attraction">Total price *</label>
            <input
              type="number"
              id="field-price-attraction"
              class="input"
              placeholder="10000"
              step="0.01"
              required
            />
          </div>
          <div class="form-group" style="flex: 0 0 auto">
            <label for="field-currency-attraction">Currency</label>
            <select id="field-currency-attraction" class="input">
              <option value="TWD">TWD</option>
              <option value="USD">USD</option>
              <option value="EUR">EUR</option>
              <option value="GBP">GBP</option>
              <option value="JPY">JPY</option>
              <option value="CNY">CNY</option>
              <option value="AUD">AUD</option>
              <option value="CAD">CAD</option>
              <option value="CHF">CHF</option>
              <option value="SGD">SGD</option>
              <option value="HKD">HKD</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label for="field-platform-attraction">Platform</label>
          <input
            type="text"
            id="field-platform-attraction"
            class="input"
            placeholder="e.g., Klook, GetYourGuide"
          />
        </div>
        <div class="form-group">
          <label for="field-notes-attraction">Notes</label>
          <textarea
            id="field-notes-attraction"
            class="input textarea"
            rows="3"
            placeholder="Optional notes..."
          ></textarea>
        </div>
      </form>

      <!-- Fixed Form Actions at Bottom -->
      <div class="form-actions-fixed">
        <button type="button" id="btn-save-booking" class="btn btn-primary">
          <span class="btn-icon">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <polyline points="20 6 9 17 4 12" />
            </svg>
          </span>
          Save booking
        </button>
        <button type="button" id="btn-cancel-booking" class="btn btn-secondary">
          <span class="btn-icon">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          </span>
          Cancel
        </button>
      </div>
    </section>

    <!-- Profile Modal -->
    <div id="profile-modal" class="profile-modal">
      <div class="profile-modal-content">
        <div class="profile-modal-header">
          <h2>Profile</h2>
          <button class="profile-modal-close" id="profile-modal-close">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              width="20"
              height="20"
            >
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          </button>
        </div>
        <div class="profile-modal-body">
          <div class="profile-modal-picture" id="profile-modal-picture">MT</div>
          <div class="profile-modal-name" id="profile-modal-name">
            Melvin Tang
          </div>
          <div class="profile-modal-email" id="profile-modal-email">
            test@example.com
          </div>
          <button
            class="btn btn-primary"
            id="profile-logout-btn"
            style="margin-top: 20px; width: 100%"
          >
            <span class="btn-icon">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                <polyline points="16 17 21 12 16 7" />
                <line x1="21" y1="12" x2="9" y2="12" />
              </svg>
            </span>
            Log out
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
